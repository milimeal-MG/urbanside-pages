function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function decrypt(pw){const enc=new TextEncoder();const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DOC.salt),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DOC.iv)},key,b64(DOC.ct));return new TextDecoder().decode(pt);}
async function unlock(){const pw=document.getElementById('pw').value;let html;try{html=await decrypt(pw);}catch(e){document.getElementById('err').style.display='block';return;}

document.getElementById('gate').style.display='none';const f=document.getElementById('frame');f.style.display='block';f.srcdoc=html;}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
