<style>
:root{--bg:#F5F7F8;--surface:#fff;--ink:#17212B;--ink2:#5D6B78;--line:#D9E0E5;--accent:#0F6E72;--err:#9F2A24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1519;--surface:#172028;--ink:#E8EDF1;--ink2:#95A3AF;--line:#2A3741;--accent:#5FC3C3;--err:#F3A19B}}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;height:100vh;overflow:hidden}

.g h1{font-size:16px;margin:0 0 6px}.g p{font-size:13px;color:var(--ink2);margin:0 0 18px;line-height:1.5}
.g input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:var(--surface);color:var(--ink)}
.g button{width:100%;margin-top:10px;padding:11px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.err{color:var(--err);font-size:12.5px;margin-top:10px;display:none}
#frame{display:none;width:100%;height:100vh;border:none;background:#fff}
</style></head><body>

function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function decrypt(pw){const enc=new TextEncoder();const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DOC.salt),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DOC.iv)},key,b64(DOC.ct));return new TextDecoder().decode(pt);}
async function unlock(){const pw=document.getElementById('pw').value;let html;try{html=await decrypt(pw);}catch(e){document.getElementById('err').style.display='block';return;}
try{sessionStorage.setItem('cc2611_pw',pw);}catch(e){}
document.getElementById('gate').style.display='none';const f=document.getElementById('frame');f.style.display='block';f.srcdoc=html;}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
